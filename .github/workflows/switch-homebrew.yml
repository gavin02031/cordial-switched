  arm64-jump-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 emulator and cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Execute real ARM64 setjmp/longjmp and corruption tests
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/android_jump_compat_test.c \
            switch/source/android_jump_compat.c \
            switch/source/android_bionic_setjmp.s -pthread \
            -o /tmp/morrow-arm64-jump-test
          qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/morrow-arm64-jump-test
      - name: Exercise ARM64 private mappings, faults and remapping
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/android_mapping_compat_test.c switch/source/android_mapping_compat.c \
            -pthread -o /tmp/morrow-arm64-mapping-test
          timeout 60s qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/morrow-arm64-mapping-test
      - name: Test ARM64 Android socket readiness and DNS ABI
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/android_socket_compat_test.c switch/source/android_socket_compat.c \
            -pthread -o /tmp/morrow-arm64-socket-test
          timeout 60s qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/morrow-arm64-socket-test
      - name: Test ARM64 locale handles and wide-character calls
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/android_wchar_compat_test.c switch/source/android_wchar_compat.c \
            -o /tmp/morrow-arm64-wchar-test
          timeout 60s qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/morrow-arm64-wchar-test

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build positional filesystem extension
        run: bash switch/scripts/build-positional-libnx.sh /tmp/morrow-libnx
      - name: Compile native Horizon target
        working-directory: switch
        run: make MORROW_LIBNX=/tmp/morrow-libnx -j2
      - name: Check generated executable
        run: |
          test -s switch/cordial-switched.elf
          test -s switch/cordial-switched.nro
          # Fail the build if the libnx exception callback was dropped by linking.
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm switch/cordial-switched.elf | grep -Eq ' [Tt] __libnx_exception_handler$'
          ls -lh switch/cordial-switched.nro
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: cordial-switched-switch-preview
          path: |
            switch/cordial-switched.nro
            switch/AOSP-NOTICE.txt
          if-no-files-found: error

  jni-provider-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JNI implementation
        run: git submodule update --init third_party/libjnivm
      - name: Apply audited JNI local-reference fix
        run: |
          git -C third_party/libjnivm apply --check ../../switch/patches/libjnivm-local-refs.patch
          git -C third_party/libjnivm apply ../../switch/patches/libjnivm-local-refs.patch
      - name: Apply bounded JNI registered-native dispatch
        run: |
          git -C third_party/libjnivm apply --check ../../switch/patches/libjnivm-native-int-dispatch.patch
          git -C third_party/libjnivm apply ../../switch/patches/libjnivm-native-int-dispatch.patch
      - name: Build native JNI VM for provider tests
        run: |
          cmake -S third_party/libjnivm -B /tmp/morrow-jnivm-host \
            -DCMAKE_CXX_FLAGS='-O2 -include string' \
            -DJNIVM_ENABLE_TESTS=OFF -DJNIVM_ENABLE_DEBUG=OFF \
            -DJNIVM_BUILD_EXAMPLES=OFF
          cmake --build /tmp/morrow-jnivm-host --target jnivm --parallel 2
      - name: Test real JNI VM through strict bridge
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            -c switch/source/android_jni_vm_bridge.c -o /tmp/morrow-bridge.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            -c switch/source/android_native_window_compat.c -o /tmp/morrow-window.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            -c switch/source/android_asset_compat.c -o /tmp/morrow-asset.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            -c switch/source/android_configuration_compat.c -o /tmp/morrow-config.o
          c++ -std=gnu++14 -O2 -include string -DEnableJNIVMGC \
            -Ithird_party/libjnivm/include -Iswitch/source \
            switch/tests/morrow_jni_runtime_test.cpp \
            switch/source/morrow_jni_runtime.cpp /tmp/morrow-bridge.o /tmp/morrow-window.o \
            /tmp/morrow-asset.o /tmp/morrow-config.o \
            /tmp/morrow-jnivm-host/libjnivm.a -pthread -ldl \
            -o /tmp/morrow-jni-provider-test
          /tmp/morrow-jni-provider-test

  jni-crossbuild:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JNI implementation
        # The devkitPro container runs as a different uid than checkout's
        # bind-mounted owner. Trust only this checked-out workspace, not '*'.
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init third_party/libjnivm
      - name: Apply audited JNI local-reference fix
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE/third_party/libjnivm" -C third_party/libjnivm apply --check ../../switch/patches/libjnivm-local-refs.patch
          git -c safe.directory="$GITHUB_WORKSPACE/third_party/libjnivm" -C third_party/libjnivm apply ../../switch/patches/libjnivm-local-refs.patch
      - name: Apply bounded JNI registered-native dispatch
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE/third_party/libjnivm" -C third_party/libjnivm apply --check ../../switch/patches/libjnivm-native-int-dispatch.patch
          git -c safe.directory="$GITHUB_WORKSPACE/third_party/libjnivm" -C third_party/libjnivm apply ../../switch/patches/libjnivm-native-int-dispatch.patch
      - name: Cross-compile libjnivm for Horizon ARM64
        run: |
          # switch_rules sets compiler paths from DEVKITPRO; DEVKITA64 is not
          # necessarily exported by the devkitA64 container.
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          # The pinned libjnivm vm.h includes unordered_map before string.
          # GCC 15 requires string's std::hash specialization first.
          cmake -S third_party/libjnivm -B /tmp/morrow-jnivm-a64 \
            -DCMAKE_CXX_COMPILER="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_CXX_FLAGS='-O2 -march=armv8-a -fPIC -D__SWITCH__ -include string' \
            -DJNIVM_ENABLE_TESTS=OFF \
            -DJNIVM_ENABLE_DEBUG=OFF \
            -DJNIVM_BUILD_EXAMPLES=OFF
          cmake --build /tmp/morrow-jnivm-a64 --target jnivm --parallel 2
          test -s /tmp/morrow-jnivm-a64/libjnivm.a
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm" -C /tmp/morrow-jnivm-a64/libjnivm.a > /tmp/morrow-jnivm-symbols.txt
          grep -q 'jnivm::VM' /tmp/morrow-jnivm-symbols.txt
      - name: Link standalone on-console JNI diagnostic
        working-directory: switch/jni_probe
        run: make MORROW_LIBNX=/tmp/morrow-libnx -j2
      - name: Build positional filesystem extension
        run: bash switch/scripts/build-positional-libnx.sh /tmp/morrow-libnx
      - name: Link opt-in JNI runtime into main Morrow preview
        working-directory: switch
        run: make WITH_JNIVM=1 MORROW_LIBNX=/tmp/morrow-libnx -j2
      - name: Check JNI diagnostic executable
        run: |
          test -s switch/jni_probe/morrow-jni-probe.elf
          test -s switch/jni_probe/morrow-jni-probe.nro
          ls -lh switch/jni_probe/morrow-jni-probe.nro
      - name: Upload isolated JNI diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: morrow-switch-jni-probe
          path: switch/jni_probe/morrow-jni-probe.nro
          if-no-files-found: error
      - name: Upload opt-in JNI runtime preview
        uses: actions/upload-artifact@v4
        with:
          name: morrow-switch-jni-runtime-preview
          path: |
            switch/cordial-switched.nro
            switch/AOSP-NOTICE.txt
          if-no-files-found: error
