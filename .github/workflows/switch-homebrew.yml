name: Cordial Switched - Horizon preview

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch-homebrew.yml'
  pull_request:
    paths:
      - 'switch/**'
      - '.github/workflows/switch-homebrew.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elf-probe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only ARM64 ELF inspector
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/elf_probe_test.c switch/source/elf_probe.c switch/source/android_log_compat.c \
            -o /tmp/cordial-elf-probe-test
          /tmp/cordial-elf-probe-test
      - name: Test non-executable ARM64 segment staging
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/engine_stage_test.c switch/source/engine_stage.c switch/source/engine_boot_log.c switch/source/elf_probe.c \
            switch/source/android_log_compat.c \
            -o /tmp/cordial-engine-stage-test
          /tmp/cordial-engine-stage-test
      - name: Test strict Android liblog providers
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iswitch/source \
            switch/tests/android_log_compat_test.c switch/source/android_log_compat.c \
            -o /tmp/cordial-android-log-test
          /tmp/cordial-android-log-test

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Horizon target
        working-directory: switch
        run: make -j2
      - name: Check generated executable
        run: |
          test -s switch/cordial-switched.elf
          test -s switch/cordial-switched.nro
          ls -lh switch/cordial-switched.nro
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: cordial-switched-switch-preview
          path: switch/cordial-switched.nro
          if-no-files-found: error
